name: Windows desktop checks

on:
  pull_request:
  push:
    branches:
      - feat/tauri-desktop
      - "agent/**"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build FM26 statistics reader
        shell: pwsh
        run: |
          python -m pip install fmsave==0.5.10 pyinstaller==6.16.0
          python -m PyInstaller --onefile --noconfirm --clean --collect-all fmsave --name fmstats tools/fmstats_sidecar.py
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item dist/fmstats.exe src-tauri/binaries/fmstats-x86_64-pc-windows-msvc.exe

      - name: Build frontend
        run: npm run build

      - name: Check Windows backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: fm-player-sorter-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
